<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance - Students</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      max-width: 700px;
      margin: 16px auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000010;
    }

    h1, h2 { color: #172554; margin-top: 0; }

    label { display: block; margin: 12px 0 6px; font-weight: bold; }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input, textarea { border: 1px solid #cbd5e1; }

    button {
      margin-top: 12px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .gray { background: #475569; }

    .note { color: #64748b; font-size: 13px; line-height: 1.5; }
    #msg { font-weight: bold; margin-top: 12px; overflow-wrap: anywhere; }
    .ok { color: #166534; }
    .bad { color: #b91c1c; }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .row .id { min-width: 90px; font-weight: bold; color: #172554; overflow-wrap: anywhere; }
    .row .nm { flex: 1; overflow-wrap: anywhere; }
    .pw { font-family: monospace; font-size: 13px; color: #475569; margin-top: 2px; }
    .row .key { background: #dbeafe; color: #123b73; }

    .row button {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      background: #fee2e2;
      color: #b91c1c;
    }

    a { color: #123b73; }
  </style>
</head>

<body>
  <script>
    // Shows an error on screen if something fails to load.
    window.addEventListener("error", function (e) {
      var b = document.createElement("div");
      b.style.cssText = "background:#fee2e2;color:#991b1b;padding:12px;margin:8px;border-radius:8px;font-weight:bold;overflow-wrap:anywhere";
      b.textContent = "Error: " + (e.message || "could not load a file (check store.js)");
      document.body.prepend(b);
    });
  </script>

  <div class="card" id="mainCard">
    <h1>👩‍🎓 Students</h1>
    <p class="note">PRN is the student's login ID. You (staff) type the password. Give each student their PRN and password.</p>

    <h2>Add one student</h2>
    <label for="onePrn">PRN</label>
    <input id="onePrn" type="text" placeholder="e.g. 2024001234" autocomplete="off">
    <label for="oneName">Full Name</label>
    <input id="oneName" type="text" placeholder="Student full name" autocomplete="off">
    <label for="onePw">Password</label>
    <input id="onePw" type="text" placeholder="At least 4 characters" autocomplete="off">
    <button onclick="addOne()">Add Student</button>

    <h2 style="margin-top:24px">Add many students at once</h2>
    <p class="note">
      One student per line: <b>PRN, Full Name, Password</b><br>
      Example: <b>2024001234, Rohit Sharma, rohit123</b>
    </p>
    <textarea id="bulk" rows="8" placeholder="2024001234, Rohit Sharma, rohit123&#10;2024001235, Priya Patil, priya123"></textarea>
    <button onclick="addBulk()">Add Students</button>

    <p id="msg"></p>
  </div>

  <div class="card" id="listCard">
    <h2>Student List (<span id="count">0</span>)</h2>
    <input id="search" type="text" placeholder="Search name or PRN">
    <button class="gray" onclick="downloadCsv()">Download Login List (CSV)</button>
    <div id="list"></div>
  </div>

  <p style="text-align:center"><a href="dashboard.html">← Back to Dashboard</a></p>

  <script type="module">
    import { saveStudents, getStudents, deleteStudent } from "./store.js";

    const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
    const msg = document.getElementById("msg");
    const MIN_PW = 4;
    let students = [];

    if (role !== "staff") {
      document.getElementById("mainCard").innerHTML =
        '<h1>Staff Login Required</h1><p><a href="index.html">Go to Login</a></p>';
      document.getElementById("listCard").hidden = true;
    }

    function show(type, text) {
      msg.className = type;
      msg.textContent = text;
    }

    function cleanName(t) {
      return t.replace(/\s+/g, " ").trim();
    }

    function cleanPrn(t) {
      return t.replace(/\s+/g, "").toUpperCase();
    }

    // PRN is used as the document id, so allow only safe characters.
    function validPrn(p) {
      return /^[A-Z0-9-]+$/.test(p);
    }

    // Reads pasted lines: PRN, Full Name, Password
    function parseLines(text) {
      const items = [];
      let bad = 0;
      text.split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line) return;
        const parts = line.split(/[,\t]/);
        const prn = cleanPrn(parts[0] || "");
        const name = cleanName(parts[1] || "");
        const password = (parts[2] || "").trim();
        if (!validPrn(prn) || !name || password.length < MIN_PW) { bad++; return; }
        items.push({ prn: prn, name: name, password: password });
      });
      return { items: items, bad: bad };
    }

    async function addStudents(items, badCount) {
      const have = new Set(students.map(function (s) { return s.id; }));
      const toSave = [];
      let skipped = 0;

      items.forEach(function (it) {
        if (have.has(it.prn)) { skipped++; return; }
        have.add(it.prn);
        toSave.push({
          id: it.prn,
          name: it.name,
          password: it.password,
          roll: it.prn,
          batch: ""
        });
      });

      if (toSave.length) await saveStudents(toSave);
      await reload();

      let text = "Added " + toSave.length + " student(s).";
      if (skipped) text += " Skipped " + skipped + " (PRN already exists).";
      if (badCount) text += " " + badCount + " line(s) wrong (need PRN, Name, Password of " + MIN_PW + "+ characters).";
      show(toSave.length ? "ok" : "bad", text);
      return toSave.length;
    }

    async function addBulk() {
      const r = parseLines(document.getElementById("bulk").value);
      if (!r.items.length) {
        show("bad", "Format: PRN, Full Name, Password (password " + MIN_PW + "+ characters).");
        return;
      }
      try {
        const added = await addStudents(r.items, r.bad);
        if (added && !r.bad) document.getElementById("bulk").value = "";
      } catch (e) {
        console.error(e);
        show("bad", "Could not save. Check Firebase setup.");
      }
    }

    async function addOne() {
      const prn = cleanPrn(document.getElementById("onePrn").value);
      const name = cleanName(document.getElementById("oneName").value);
      const password = document.getElementById("onePw").value.trim();

      if (!prn) { show("bad", "Please enter the PRN."); return; }
      if (!validPrn(prn)) { show("bad", "PRN can have only letters, numbers and -"); return; }
      if (!name) { show("bad", "Please enter the full name."); return; }
      if (password.length < MIN_PW) { show("bad", "Password must be at least " + MIN_PW + " characters."); return; }

      try {
        const added = await addStudents([{ prn: prn, name: name, password: password }], 0);
        if (added) {
          document.getElementById("onePrn").value = "";
          document.getElementById("oneName").value = "";
          document.getElementById("onePw").value = "";
        }
      } catch (e) {
        console.error(e);
        show("bad", "Could not save. Check Firebase setup.");
      }
    }

    async function changePw(id) {
      const s = students.find(function (x) { return x.id === id; });
      if (!s) return;
      const input = prompt("New password for " + id + " (at least " + MIN_PW + " characters):");
      if (input === null) return;
      const password = input.trim();
      if (password.length < MIN_PW) { show("bad", "Password must be at least " + MIN_PW + " characters."); return; }
      try {
        await saveStudents([Object.assign({}, s, { password: password })]);
        await reload();
        show("ok", "Password changed for " + id + ".");
      } catch (e) {
        console.error(e);
        show("bad", "Could not save.");
      }
    }

    async function remove(id) {
      if (!confirm("Delete " + id + "?")) return;
      try {
        await deleteStudent(id);
        await reload();
        show("ok", id + " deleted.");
      } catch (e) {
        console.error(e);
        show("bad", "Could not delete.");
      }
    }

    function render() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const box = document.getElementById("list");
      box.innerHTML = "";
      document.getElementById("count").textContent = students.length;

      students.filter(function (s) {
        return !q || s.id.toLowerCase().includes(q) || (s.name || "").toLowerCase().includes(q);
      }).forEach(function (s) {
        const row = document.createElement("div");
        row.className = "row";

        const id = document.createElement("span");
        id.className = "id";
        id.textContent = s.id;

        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = s.name;
        const pw = document.createElement("div");
        pw.className = "pw";
        pw.textContent = "Password: " + (s.password || "(not set)");
        nm.appendChild(pw);

        const key = document.createElement("button");
        key.className = "key";
        key.textContent = "🔑";
        key.title = "Change password";
        key.onclick = function () { changePw(s.id); };

        const del = document.createElement("button");
        del.textContent = "✕";
        del.onclick = function () { remove(s.id); };

        row.append(id, nm, key, del);
        box.appendChild(row);
      });
    }

    async function reload() {
      students = await getStudents();
      render();
    }

    function downloadCsv() {
      const lines = ["PRN,Name,Password"].concat(students.map(function (s) {
        return s.id + ',"' + (s.name || "").replace(/"/g, '""') + '","' +
          (s.password || "").replace(/"/g, '""') + '"';
      }));
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "student-logins.csv";
      a.click();
    }

    window.addBulk = addBulk;
    window.addOne = addOne;
    window.downloadCsv = downloadCsv;
    document.getElementById("search").addEventListener("input", render);

    if (role === "staff") reload().catch(function (e) {
      console.error(e);
      show("bad", "Could not load students. Check Firebase setup.");
    });
  </script>
</body>
</html>
