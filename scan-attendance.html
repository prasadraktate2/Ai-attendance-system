<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance - Scan QR</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px #00000010;
      text-align: center;
    }

    h1 { color: #123b73; }

    button, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      margin-top: 12px;
      border: none;
      background: #123b73;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    textarea {
      border: 1px solid #cbd5e1;
      font-size: 13px;
    }

    #reader { width: 100%; margin-top: 12px; }

    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .ok { background: #dcfce7; color: #166534; }
    .bad { background: #fee2e2; color: #991b1b; }
    .info { background: #dbeafe; color: #123b73; }

    .note { color: #64748b; font-size: 13px; line-height: 1.5; }
    a { color: #123b73; }
  </style>
</head>

<body>
  <div class="container">
    <h1>📷 AI Smart Attendance</h1>
    <h2>Scan Attendance QR</h2>
    <p id="who"></p>

    <button id="scanBtn" onclick="startScan()">Start Camera Scan</button>
    <div id="reader"></div>

    <div id="demoBox" hidden>
      <p class="note">DEMO: paste the QR text from the staff page here.</p>
      <textarea id="pasteText" rows="3" placeholder='{"s":"...","t":"..."}'></textarea>
      <button onclick="submitPasted()">Mark Attendance</button>
    </div>

    <div id="result" class="info">Scan the QR shown by your teacher.</div>

    <p><a href="dashboard.html">← Back to Dashboard</a></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script type="module">
    import { USE_FIREBASE, getSession, markPresent } from "./store.js";

    const resultBox = document.getElementById("result");
    let scanner = null;
    let busy = false;

    function checkStudent() {
      const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
      const user = sessionStorage.getItem("attendanceUser");

      if (!user || role !== "student") {
        document.querySelector(".container").innerHTML =
          '<h1>Student Login Required</h1>' +
          '<p>Please log in using the Student option.</p>' +
          '<p><a href="index.html">Go to Login</a></p>';
        return false;
      }

      document.getElementById("who").textContent =
        user + " (" + sessionStorage.getItem("attendanceUserId") + ")";
      return true;
    }

    function show(type, text) {
      resultBox.className = type;
      resultBox.textContent = text;
    }

    async function processCode(text) {
      if (busy) return;
      busy = true;

      try {
        let data;
        try { data = JSON.parse(text); } catch (e) { data = null; }

        if (!data || !data.s || !data.t) {
          show("bad", "This is not an attendance QR.");
          return;
        }

        const session = await getSession(data.s);

        if (!session || !session.active) {
          show("bad", "This lecture is not active.");
          return;
        }

        const now = Date.now();
        const currentOk = data.t === session.token && now <= session.tokenExpiresAt + 2000;
        const prevOk = data.t === session.prevToken && now <= session.tokenExpiresAt - 5000;

        if (!currentOk && !prevOk) {
          show("bad", "QR expired. Scan the latest QR.");
          return;
        }

        const student = {
          id: sessionStorage.getItem("attendanceUserId"),
          name: sessionStorage.getItem("attendanceUser")
        };

        const res = await markPresent(data.s, student);

        if (res === "duplicate") {
          show("info", "Attendance already marked for " + session.subject + ".");
        } else {
          show("ok", "✅ Present: " + session.subject + " — Lecture " + session.lecture);
        }

        await stopScan();
      } catch (e) {
        console.error(e);
        show("bad", "Something went wrong. Try again.");
      } finally {
        busy = false;
      }
    }

    async function startScan() {
      if (typeof Html5Qrcode === "undefined") {
        show("bad", "Scanner library did not load. Check your internet.");
        return;
      }
      try {
        scanner = new Html5Qrcode("reader");
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 220 },
          processCode,
          function () {}
        );
        show("info", "Point the camera at the QR.");
      } catch (e) {
        console.error(e);
        show("bad", "Camera not available. Allow camera permission.");
      }
    }

    async function stopScan() {
      if (scanner) {
        try { await scanner.stop(); scanner.clear(); } catch (e) {}
        scanner = null;
      }
    }

    function submitPasted() {
      processCode(document.getElementById("pasteText").value.trim());
    }

    window.startScan = startScan;
    window.submitPasted = submitPasted;

    if (checkStudent() && !USE_FIREBASE) {
      document.getElementById("demoBox").hidden = false;
    }
  </script>
</body>
</html>
