<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance</title>

  <style>
    * { box-sizing: border-box; }

    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }

    header { background: #000; color: white; padding: 16px; display: flex; gap: 18px; align-items: center; }
    header a { color: white; text-decoration: none; font-size: 26px; }
    header h1 { margin: 0; font-size: 22px; }

    .wrap { max-width: 700px; margin: 0 auto; padding: 12px; }
    .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px #0000000f; }
    .who { font-size: 18px; font-weight: bold; }
    .sub { color: #64748b; margin-top: 4px; }

    button, textarea { width: 100%; padding: 13px; border-radius: 8px; font-size: 16px; }
    button { margin-top: 12px; border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    textarea { border: 1px solid #cbd5e1; font-size: 13px; }
    #reader { width: 100%; margin-top: 12px; }

    #result { margin-top: 12px; padding: 12px; border-radius: 8px; font-weight: bold; overflow-wrap: anywhere; }
    .ok { background: #dcfce7; color: #166534; }
    .bad { background: #fee2e2; color: #991b1b; }
    .info { background: #dbeafe; color: #123b73; }

    h3 { margin: 0 0 8px; color: #172554; }
    .ls { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #e2e8f0; }
    .ls:first-of-type { border-top: none; }
    .tm { font-size: 12px; color: #64748b; min-width: 70px; line-height: 1.4; }
    .sj { flex: 1; min-width: 0; font-weight: bold; overflow-wrap: anywhere; }
    .sj small { display: block; font-weight: normal; color: #64748b; font-size: 12px; }
    .tg { font-size: 12px; font-weight: bold; padding: 4px 9px; border-radius: 6px; white-space: nowrap; }
    .tP { background: #dcfce7; color: #166534; }
    .tA { background: #fee2e2; color: #b91c1c; }
    .tW { background: #fef3c7; color: #b45309; }
    .tN { background: #e2e8f0; color: #475569; }
    .tB { background: #dbeafe; color: #1d4ed8; }
    .note { color: #64748b; font-size: 13px; }
    a { color: #123b73; }
  </style>
</head>

<body>
  <header><a href="dashboard.html">←</a><h1>Attendance</h1></header>

  <div class="wrap" id="wrap">
    <div class="card">
      <div class="who" id="who"></div>
      <div class="sub" id="sub"></div>
      <button onclick="startScan()">📷 Start camera scan</button>
      <div id="reader"></div>

      <div id="demoBox" hidden>
        <p class="note">DEMO: paste the QR text from the staff page here.</p>
        <textarea id="pasteText" rows="3" placeholder='{"s":"...","t":"..."}'></textarea>
        <button onclick="submitPasted()">Mark attendance</button>
      </div>

      <div id="result" class="info">Scan the QR shown by your teacher.</div>
    </div>

    <div class="card">
      <h3 id="todayTitle">Today's lectures</h3>
      <div id="lectures">Loading...</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <script type="module">
    import { USE_FIREBASE, getSession, markPresent } from "./store.js";
    import { sessionsOn, attendedSessionIds } from "./attendance-data.js";
    import { TIMETABLE, DAY_NAMES, fmt } from "./timetable.js";

    const resultBox = document.getElementById("result");
    const studentId = sessionStorage.getItem("attendanceUserId");
    const studentName = sessionStorage.getItem("attendanceUser");
    let scanner = null;
    let busy = false;

    function todayString() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
    }

    function mins(t) { return Number(t.slice(0, 2)) * 60 + Number(t.slice(3)); }

    function show(type, text) {
      resultBox.className = type;
      resultBox.textContent = text;
    }

    function checkStudent() {
      const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
      if (!studentName || role !== "student") {
        document.getElementById("wrap").innerHTML =
          '<div class="card"><h3>Student login required</h3><p><a href="index.html">Go to Login</a></p></div>';
        return false;
      }
      document.getElementById("who").textContent = studentName;
      document.getElementById("sub").textContent = studentId + " | Student";
      return true;
    }

    function tag(cls, text) {
      const t = document.createElement("span");
      t.className = "tg " + cls;
      t.textContent = text;
      return t;
    }

    async function renderLectures() {
      const box = document.getElementById("lectures");
      const dayIdx = new Date().getDay();
      if (dayIdx === 0) {
        box.textContent = "No classes on Sunday.";
        return;
      }
      const dayKey = DAY_NAMES[dayIdx - 1];
      document.getElementById("todayTitle").textContent = "Today's lectures (" + dayKey + ")";
      const lectures = TIMETABLE[dayKey].filter(function (x) { return x.type !== "Recess"; });

      let sessions = [];
      let attended = new Set();
      try {
        sessions = await sessionsOn(todayString());
        attended = await attendedSessionIds(studentId);
      } catch (e) {
        console.error(e);
        box.textContent = "Could not load today's lectures.";
        return;
      }

      const now = new Date().getHours() * 60 + new Date().getMinutes();
      box.innerHTML = "";

      lectures.forEach(function (x, i) {
        const here = sessions.filter(function (s) { return s.lecture === i + 1; });
        let t;
        if (here.some(function (s) { return attended.has(s.id); })) t = tag("tP", "Present");
        else if (here.some(function (s) { return s.active; })) t = tag("tW", "Pending");
        else if (here.length) t = tag("tA", "Absent");
        else if (now < mins(x.start)) t = tag("tN", "Not started");
        else if (now < mins(x.end)) t = tag("tB", "Waiting");
        else t = tag("tB", "NA");

        const row = document.createElement("div");
        row.className = "ls";
        const tm = document.createElement("div");
        tm.className = "tm";
        tm.innerHTML = fmt(x.start) + "<br>" + fmt(x.end);
        const sj = document.createElement("div");
        sj.className = "sj";
        sj.textContent = x.subject;
        const small = document.createElement("small");
        small.textContent = x.type;
        sj.appendChild(small);
        row.append(tm, sj, t);
        box.appendChild(row);
      });
    }

    async function processCode(text) {
      if (busy) return;
      busy = true;
      try {
        let data;
        try { data = JSON.parse(text); } catch (e) { data = null; }

        if (!data || !data.s || !data.t) { show("bad", "This is not an attendance QR."); return; }

        const session = await getSession(data.s);
        if (!session || !session.active) { show("bad", "This lecture is not active."); return; }

        const parts = (session.time || "").split("-");
        if (session.date === todayString() && parts.length === 2) {
          const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
          if (nowMin < mins(parts[0]) - 5 || nowMin >= mins(parts[1]) + 2) {
            show("bad", "This lecture's time is over.");
            return;
          }
        }

        const now = Date.now();
        const currentOk = data.t === session.token && now <= session.tokenExpiresAt + 2000;
        const prevOk = data.t === session.prevToken && now <= session.tokenExpiresAt - 5000;
        if (!currentOk && !prevOk) { show("bad", "QR expired. Scan the latest QR."); return; }

        const res = await markPresent(data.s, { id: studentId, name: studentName });
        if (res === "duplicate") show("info", "Attendance already marked for " + session.subject + ".");
        else show("ok", "✅ Present: " + session.subject + " — Lecture " + session.lecture);

        await stopScan();
        renderLectures();
      } catch (e) {
        console.error(e);
        show("bad", "Something went wrong. Try again.");
      } finally {
        busy = false;
      }
    }

    async function startScan() {
      if (typeof Html5Qrcode === "undefined") { show("bad", "Scanner library did not load. Check your internet."); return; }
      try {
        scanner = new Html5Qrcode("reader");
        await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, processCode, function () {});
        show("info", "Point the camera at the QR.");
      } catch (e) {
        console.error(e);
        show("bad", "Camera not available. Allow camera permission (needs https).");
      }
    }

    async function stopScan() {
      if (scanner) {
        try { await scanner.stop(); scanner.clear(); } catch (e) {}
        scanner = null;
      }
    }

    window.startScan = startScan;
    window.submitPasted = function () {
      processCode(document.getElementById("pasteText").value.trim());
    };

    if (checkStudent()) {
      if (!USE_FIREBASE) document.getElementById("demoBox").hidden = false;
      renderLectures();
      setInterval(renderLectures, 15000);
    }
  </script>
</body>
</html>
