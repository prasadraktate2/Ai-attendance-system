<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
    header { background: #000; color: #fff; padding: 16px; display: flex; align-items: center; gap: 14px; }
    header a { color: #fff; text-decoration: none; font-size: 24px; }
    header h1 { margin: 0; font-size: 22px; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 14px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px #00000012; text-align: center; }
    video { width: 100%; border-radius: 12px; background: #000; }
    input, button { width: 100%; padding: 12px; border-radius: 10px; font-size: 18px; margin-top: 8px; }
    input { border: 1px solid #cbd5e1; text-align: center; letter-spacing: 6px; }
    button { border: 0; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    #result { font-size: 18px; font-weight: bold; min-height: 28px; margin: 8px 0; }
    .ok { color: #16a34a; } .bad { color: #dc2626; } .info { color: #2563eb; }
    .hint { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <a href="dashboard.html">&larr;</a>
    <h1>Scan Attendance</h1>
  </header>

  <div class="wrap">
    <div class="card">
      <div id="result" class="info">Starting camera...</div>
      <video id="video" playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div class="hint">Hold the phone 20-30 cm from the QR and keep it steady.</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <script type="module">
    import { getAllSessions, markPresent } from "./store.js";

    const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
    const userId = sessionStorage.getItem("attendanceUserId");
    const userName = sessionStorage.getItem("attendanceUser");
    const result = document.getElementById("result");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    let busy = false, done = false, stream = null;

    function show(text, cls) { result.textContent = text; result.className = cls; }

    if (role !== "student" || !userId) {
      show("Please log in as a student.", "bad");
    } else {
      startCamera();
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        show("Camera needs HTTPS. Open the Firebase Hosting link on the phone.", "bad");
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        await video.play();
        show("Point the camera at the QR code", "info");
        requestAnimationFrame(tick);
      } catch (e) {
        console.error(e);
        show("Camera not available. Allow camera permission and reload.", "bad");
      }
    }

    function tick() {
      if (done) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA && !busy) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
        if (code && code.data && /^\d{6}$/.test(code.data.trim())) {
          handle(code.data.trim());
        }
      }
      requestAnimationFrame(tick);
    }

    function tokenOk(s, token) {
      return s && s.active && token &&
        (token === s.token || (s.prevToken && token === s.prevToken));
    }

    async function mark(sessionId) {
      const r = await markPresent(sessionId, { id: userId, name: userName });
      done = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (r === "duplicate") show("Already marked present for this lecture.", "info");
      else show("✅ Attendance marked: " + userName, "ok");
    }

    async function handle(token) {
      busy = true;
      show("Checking...", "info");
      try {
        const all = await getAllSessions();
        const active = all.filter(x => x.active)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0];
        if (!active || !tokenOk(active, token)) {
          show("QR expired or closed. Scan the new QR.", "bad");
          setTimeout(() => { busy = false; show("Point the camera at the QR code", "info"); }, 1500);
          return;
        }
        await mark(active.id);
      } catch (e) {
        console.error(e);
        show("Error: could not save. Check internet.", "bad");
        setTimeout(() => { busy = false; }, 1500);
      }
    }
  </script>
</body>
</html>
