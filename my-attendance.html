<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #000;
      color: white;
      padding: 16px;
      display: flex;
      gap: 18px;
      align-items: center;
    }
    header a { color: white; text-decoration: none; font-size: 26px; }
    header h1 { margin: 0; font-size: 22px; }

    .wrap { max-width: 700px; margin: 0 auto; padding: 12px; }

    .tabs { display: flex; gap: 28px; padding: 10px 16px; font-size: 20px; }
    .tab { color: #94a3b8; font-weight: bold; cursor: pointer; padding-bottom: 6px; border: none; background: none; font-size: 20px; }
    .tab.on { color: #1e293b; border-bottom: 3px solid #1e293b; }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px #0000000f;
    }

    .semrow { display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .sem {
      background: #e5e7eb; border-radius: 12px; padding: 12px 16px;
      font-size: 20px; font-weight: bold; text-align: center; line-height: 1.2;
    }
    .semmid { flex: 1; }
    .ay { color: #64748b; margin-bottom: 8px; }
    .ay b { color: #0d9488; }
    .barrow { display: flex; align-items: center; gap: 10px; }
    .bar { flex: 1; height: 8px; background: #e5e7eb; border-radius: 6px; overflow: hidden; }
    .fill { height: 100%; background: #22c55e; }
    .pct { font-weight: bold; color: #16a34a; }
    .chev { font-size: 22px; }

    .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; font-size: 18px; }
    .counts div { display: flex; justify-content: space-between; }
    .g { color: #16a34a; } .r { color: #dc2626; } .o { color: #f59e0b; } .b { color: #2563eb; }
    .counts b { font-weight: bold; }

    .legend { font-size: 17px; font-weight: bold; line-height: 1.5; margin-bottom: 12px; }

    .subjects { margin-top: 12px; border-top: 1px solid #e2e8f0; padding-top: 8px; }
    .subj { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; gap: 10px; }

    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 420px; }
    th { background: #f1f5f9; padding: 12px 4px; font-size: 16px; }
    td { text-align: center; padding: 14px 4px; font-size: 19px; font-weight: bold; border-bottom: 1px solid #fff; }
    td.d { font-size: 15px; font-weight: bold; color: #0f172a; background: white; text-align: center; }
    .P { background: #ecf5ec; color: #22a34a; }
    .A { background: #fdeaea; color: #dc2626; }
    .NA { background: #e6f1fc; color: #2563eb; }
    .PD { background: #fff4e0; color: #f59e0b; font-size: 13px; }
    .X { background: white; color: #0f172a; }

    .msg { text-align: center; padding: 30px 10px; color: #64748b; }
  </style>
</head>

<body>
  <header><a href="dashboard.html">←</a><h1>Attendance</h1></header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab on" id="tabCur">Current</button>
      <button class="tab" id="tabPrev">Previous</button>
    </div>

    <div id="content"><div class="msg">Loading...</div></div>
  </div>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { TIMETABLE, DAY_NAMES, CLASS_INFO } from "./timetable.js";

    const content = document.getElementById("content");
    if (location.search.indexOf("embed") !== -1) {
      document.querySelector("header").style.display = "none";
      document.querySelector(".tabs").style.display = "none";
    }
    const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
    const studentId = sessionStorage.getItem("attendanceUserId");

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    // lectures/labs of a day (recess removed). One entry = one attendance.
    function entriesOfKey(key) {
      return (TIMETABLE[key] || []).filter(function (x) { return x.type !== "Recess"; });
    }
    // most entries in any day = number of table columns
    const MAXN = Math.max.apply(null, DAY_NAMES.map(function (k) { return entriesOfKey(k).length; }));

    function message(text) {
      content.innerHTML = "";
      const m = document.createElement("div");
      m.className = "msg";
      m.textContent = text;
      content.appendChild(m);
    }

    document.getElementById("tabPrev").onclick = function () {
      document.getElementById("tabPrev").classList.add("on");
      document.getElementById("tabCur").classList.remove("on");
      message("No previous semester records.");
    };
    document.getElementById("tabCur").onclick = function () {
      location.reload();
    };

    function dateOf(session) {
      const d = session.date || (session.id || "").slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "";
    }

    function toDate(s) {
      const p = s.split("-").map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }

    function label(s) {
      const d = toDate(s);
      return String(d.getDate()).padStart(2, "0") + "-" + MONTHS[d.getMonth()] + "-" +
        String(d.getFullYear()).slice(2) + "\n" + DAYS[d.getDay()];
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
    }

    function academicYear() {
      const d = new Date();
      const y = d.getFullYear();
      if (d.getMonth() >= 6) return y + "-" + String(y + 1).slice(2) + " - Odd";
      return (y - 1) + "-" + String(y).slice(2) + " - Even";
    }

    function mins(t) { return Number(t.slice(0, 2)) * 60 + Number(t.slice(3)); }

    // session number n comes from the id: 2026-11-05_S3 -> 3
    function slotOf(s) {
      const m = /_S(\d+)$/.exec(s.id || "");
      if (m) return Number(m[1]);
      return Number.isInteger(s.slot) ? s.slot : 0;
    }

    function build(sessions, attended) {
      const byDate = {};
      sessions.forEach(function (s) {
        const d = dateOf(s);
        if (!d) return;
        (byDate[d] = byDate[d] || []).push(s);
      });

      const dates = Object.keys(byDate).sort().reverse();
      const rows = [];
      const stat = { P: 0, A: 0, PD: 0, NA: 0 };
      const subj = {};
      const today = todayStr();
      const nowD = new Date();
      const now = nowD.getHours() * 60 + nowD.getMinutes();

      dates.forEach(function (d) {
        const dayIdx = toDate(d).getDay();
        const isSun = dayIdx === 0;
        // Sunday uses Monday's list (same as the staff page, for testing)
        const entries = entriesOfKey(isSun ? "Mon" : DAY_NAMES[dayIdx - 1]);

        const bySlot = {};
        byDate[d].forEach(function (s) {
          const n = slotOf(s);
          if (n >= 1 && n <= entries.length) (bySlot[n] = bySlot[n] || []).push(s);
        });

        const cells = [];
        for (let n = 1; n <= MAXN; n++) {
          if (n > entries.length) { cells.push("X"); continue; }
          const entry = entries[n - 1];
          const here = bySlot[n];
          if (here) {
            let code;
            if (here.some(function (s) { return attended.has(s.id); })) code = "P";
            else if (here.some(function (s) { return s.active && d === today; })) code = "PD";
            else code = "A";
            stat[code]++;
            const sub = entry.subject || here[0].subject || "Other";
            subj[sub] = subj[sub] || { P: 0, A: 0, PD: 0 };
            subj[sub][code]++;
            cells.push(code);
          } else if (!isSun && (d < today || (d === today && now >= mins(entry.end)))) {
            stat.NA++;
            cells.push("NA");
          } else {
            cells.push("X");
          }
        }
        rows.push({ date: d, cells: cells });
      });

      return { rows: rows, stat: stat, subj: subj };
    }

    function render(r) {
      const s = r.stat;
      const total = s.P + s.A + s.PD + s.NA;
      const counted = s.P + s.A;
      const pct = counted ? (s.P / counted) * 100 : 0;
      const color = pct >= 75 ? "#22c55e" : (pct >= 60 ? "#f59e0b" : "#dc2626");

      content.innerHTML = "";

      // Summary card
      const top = document.createElement("div");
      top.className = "card";
      top.innerHTML =
        '<div class="semrow" id="semrow">' +
          '<div class="sem">Sem<br>' + CLASS_INFO.sem + '</div>' +
          '<div class="semmid"><div class="ay">A.Y. <b>' + academicYear() + '</b></div>' +
          '<div class="barrow"><div class="bar"><div class="fill" style="width:' + pct +
          '%;background:' + color + '"></div></div>' +
          '<div class="pct" style="color:' + color + '">' + pct.toFixed(2) + '%</div></div></div>' +
          '<div class="chev" id="chev">⌄</div>' +
        '</div><div class="subjects" id="subjects" hidden></div>';
      content.appendChild(top);

      const subBox = top.querySelector("#subjects");
      Object.keys(r.subj).sort().forEach(function (name) {
        const v = r.subj[name];
        const c = v.P + v.A;
        const row = document.createElement("div");
        row.className = "subj";
        const a = document.createElement("span");
        a.textContent = name;
        const b = document.createElement("b");
        b.textContent = v.P + "/" + c + (c ? "  (" + ((v.P / c) * 100).toFixed(0) + "%)" : "");
        row.append(a, b);
        subBox.appendChild(row);
      });
      top.querySelector("#semrow").onclick = function () {
        subBox.hidden = !subBox.hidden;
        top.querySelector("#chev").textContent = subBox.hidden ? "⌄" : "⌃";
      };

      // Counts card
      const counts = document.createElement("div");
      counts.className = "card counts";
      counts.innerHTML =
        '<div class="g"><span>Present :</span><b>' + s.P + ' / ' + total + '</b></div>' +
        '<div class="r"><span>Absent :</span><b>' + s.A + ' / ' + total + '</b></div>' +
        '<div class="o"><span>Pending :</span><b>' + s.PD + ' / ' + total + '</b></div>' +
        '<div class="b"><span>No Attendance :</span><b>' + s.NA + ' / ' + total + '</b></div>';
      content.appendChild(counts);

      // Table card
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = '<div class="legend">P = Present , A = Absent, NA = No Attendance, - = No Lecture/Lab<br>' +
        '<span style="font-weight:normal;font-size:14px;color:#64748b">Columns follow the day\'s timetable (recess not counted). A 2-hour lab = 1 attendance.</span></div>';

      if (!r.rows.length) {
        const e = document.createElement("div");
        e.className = "msg";
        e.textContent = "No attendance has been taken yet.";
        card.appendChild(e);
      } else {
        const wrap = document.createElement("div");
        wrap.className = "scroll";
        const table = document.createElement("table");
        const head = document.createElement("tr");
        const th0 = document.createElement("th");
        th0.textContent = "Date";
        head.appendChild(th0);
        for (let n = 1; n <= MAXN; n++) {
          const th = document.createElement("th");
          th.innerHTML = "Slot<br>" + n;
          head.appendChild(th);
        }
        table.appendChild(head);

        r.rows.forEach(function (row) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.className = "d";
          const parts = label(row.date).split("\n");
          td.append(parts[0], document.createElement("br"), parts[1]);
          tr.appendChild(td);
          row.cells.forEach(function (c) {
            const cell = document.createElement("td");
            cell.className = c;
            cell.textContent = c === "X" ? "-" : (c === "PD" ? "Pending" : c);
            tr.appendChild(cell);
          });
          table.appendChild(tr);
        });
        wrap.appendChild(table);
        card.appendChild(wrap);
      }
      content.appendChild(card);
    }

    async function start() {
      if (role !== "student" || !studentId) {
        message("This page is for students. Please log in as a Student.");
        return;
      }

      let cfg = null;
      try { cfg = (await import("./store.js")).firebaseConfig; } catch (e) { console.error(e); }
      if (!cfg) {
        message("In store.js, write 'export' before 'const firebaseConfig' and upload it again.");
        return;
      }

      try {
        const app = getApps().length ? getApp() : initializeApp(cfg);
        const db = getFirestore(app);

        const sessSnap = await getDocs(collection(db, "sessions"));
        const sessions = sessSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

        const attSnap = await getDocs(query(collection(db, "attendance"), where("studentId", "==", studentId)));
        const attended = new Set(attSnap.docs.map(function (d) { return d.data().sessionId; }));

        render(build(sessions, attended));
      } catch (e) {
        console.error(e);
        message("Could not load attendance. Check your internet and Firebase.");
      }
    }

    start();
  </script>
</body>
</html>
