<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Smart Attendance System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#173b70;color:white;text-align:center;padding:18px}
main{max-width:1000px;margin:22px auto;padding:12px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 4px 18px #0001;margin-bottom:16px}
input,select{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{background:#2459a9;color:white;border:0;border-radius:8px;padding:11px 14px;margin:4px;cursor:pointer}
button:hover{background:#173b70}
.secondary{background:#64748b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:#eaf2ff;padding:15px;border-radius:10px}
.hidden{display:none}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px;border:1px solid #dbe2ec;text-align:left}
th{background:#eaf2ff}
.notice{background:#fff7db;padding:12px;border-radius:8px;font-size:14px}
#qrCode{display:flex;justify-content:center;margin:20px auto}
@media(max-width:600px){main{padding:8px}.card{padding:14px}th,td{font-size:13px;padding:7px}}
</style>
</head>
<body>
<header>
<h1>AI Smart Attendance System</h1>
<p>College Attendance Management</p>
</header>
<main>
<section class="card" id="loginPage">
<h2>Login</h2>
<form id="loginForm">
<label>Login as</label>
<select id="role"><option>Student</option><option>Staff</option></select>
<label>User ID</label>
<input id="userId" required placeholder="Enter your ID">
<button type="submit">Continue</button>
</form>
<p class="notice">Demo login only. Secure authentication is not connected yet.</p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2 id="welcome"></h2>
<p id="userInfo"></p>
<div id="menu"></div>
<button class="secondary" id="logoutBtn">Logout</button>
</div>
<div id="view"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let role="",user="",qrTimer=null;

const timetable={
 Monday:[
 ["1","Chemistry","10:00–10:50"],
 ["2","Engineering Mathematics-I","10:50–11:50"],
 ["3","Verbal Communication Skills","12:30–2:30"],
 ["4","Chemistry","2:50–4:50"]],
 Tuesday:[
 ["1","Environmental Science","10:00–10:50"],
 ["2","Engineering Mathematics-I","10:50–11:50"],
 ["3","Computational Thinking & Problem Solving","12:30–2:30"],
 ["4","Computational Thinking & Problem Solving","2:50–3:50"],
 ["5","Physics","3:50–4:50"]],
 Wednesday:[
 ["1","Communication","10:00–10:50"],
 ["2","Chemistry","10:50–11:50"],
 ["3","Computational Thinking & Problem Solving","12:30–1:30"],
 ["4","Engineering Mathematics-I","1:30–2:30"],
 ["5","Yoga and Meditation","2:30–4:50"]],
 Thursday:[
 ["1","Physics","10:00–10:55"],
 ["2","Environmental Science","10:55–11:50"],
 ["3","Computer Workshop Practice","12:30–2:30"],
 ["4","Computer Workshop Practice","2:50–4:50"]],
 Friday:[
 ["1","Engineering Mathematics-I","10:00–10:55"],
 ["2","Computational Thinking & Problem Solving","10:55–11:50"],
 ["3","Computer Workshop Practice","12:30–2:30"],
 ["4","Introduction to AI Tools","2:50–4:50"]],
 Saturday:[["1","Mandatory Course-I","2:50–4:50"]]
};

function stopQR(){
 if(qrTimer){clearInterval(qrTimer);qrTimer=null;}
}
function safe(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
$("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 role=$("role").value;
 user=$("userId").value.trim();
 if(!user)return;
 $("loginPage").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 $("welcome").textContent=role+" Dashboard";
 $("userInfo").textContent="User ID: "+user;
 $("menu").innerHTML="";
 addButton("Dashboard",showHome);
 addButton("Weekly Timetable",showTimetable);
 if(role==="Staff"){
  addButton("Generate QR Code",showQR);
  addButton("Manual Attendance",showManual);
  addButton("Attendance Reports / CSV",showReports);
 }else{
  addButton("My Attendance",showMyAttendance);
 }
 showHome();
});
function addButton(label,fn){
 const b=document.createElement("button");
 b.textContent=label;b.onclick=fn;$("menu").appendChild(b);
}
function showHome(){
 stopQR();
 $("view").innerHTML=`
 <div class="card"><h2>Dashboard Overview</h2>
 <div class="grid">
 <div class="stat"><b>Role</b><p>${safe(role)}</p></div>
 <div class="stat"><b>User ID</b><p>${safe(user)}</p></div>
 <div class="stat"><b>Timetable</b><p>Monday–Saturday</p></div>
 </div>
 <p class="notice">Demo version: records are not saved to a database.</p></div>`;
}
function showTimetable(){
 stopQR();
 $("view").innerHTML=`
 <div class="card"><h2>Weekly Timetable</h2>
 <label>Select Day</label><select id="daySelect"></select>
 <div class="table-wrap"><table>
 <thead><tr><th>Lecture</th><th>Subject</th><th>Time</th></tr></thead>
 <tbody id="rows"></tbody></table></div></div>`;
 Object.keys(timetable).forEach(day=>{
  const o=document.createElement("option");o.value=day;o.textContent=day;$("daySelect").appendChild(o);
 });
 function render(){
  $("rows").innerHTML=timetable[$("daySelect").value].map(r=>
   `<tr><td>${r[0]}</td><td>${safe(r[1])}</td><td>${r[2]}</td></tr>`).join("");
 }
 $("daySelect").onchange=render;render();
}
function showQR(){
 stopQR();
 $("view").innerHTML=`
 <div class="card"><h2>QR Code Attendance</h2>
 <label>Subject</label><select id="qrSubject"></select>
 <div id="qrCode"></div><p id="qrStatus"></p>
 <p class="notice">Demo QR only. Scanning does not record attendance or validate expiry on a server.</p>
 </div>`;
 const subjects=[...new Set(Object.values(timetable).flat().map(r=>r[1]))];
 subjects.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;$("qrSubject").appendChild(o);});
 function generate(){
  if(!$("qrCode")||!$("qrStatus"))return;
  $("qrCode").innerHTML="";
  if(typeof QRCode==="undefined"){
   $("qrStatus").textContent="QR library load nahi zali. Internet check kara.";return;
  }
  const data=JSON.stringify({
   project:"AI Smart Attendance",
   subject:$("qrSubject").value,
   token:"DEMO-"+Date.now(),
   createdAt:new Date().toISOString(),
   demoOnly:true
  });
  new QRCode($("qrCode"),{text:data,width:220,height:220});
  $("qrStatus").textContent="QR refreshed: "+new Date().toLocaleTimeString();
 }
 generate();qrTimer=setInterval(generate,10000);
 $("qrSubject").onchange=generate;
}
function showManual(){
 stopQR();
 $("view").innerHTML=`
 <div class="card"><h2>Manual Attendance Demo</h2>
 <label>Student ID</label><input id="studentId" placeholder="Enter Student ID">
 <label>Subject</label><select id="manualSubject"></select>
 <button id="markBtn">Preview Present</button><p id="manualStatus"></p>
 <p class="notice">Preview only; attendance is not saved.</p></div>`;
 addSubjects("manualSubject");
 $("markBtn").onclick=()=>{
  const id=$("studentId").value.trim();
  $("manualStatus").textContent=id?"Demo preview: "+id+" — Present. Not saved.":"Enter Student ID first.";
 };
}
function showMyAttendance(){
 stopQR();
 $("view").innerHTML=`<div class="card"><h2>My Attendance</h2>
 <p>Student ID: ${safe(user)}</p><p>No saved attendance records in this demo.</p></div>`;
}
function showReports(){
 stopQR();
 $("view").innerHTML=`<div class="card"><h2>Attendance Reports</h2>
 <p>Sample CSV only; actual records are not connected.</p>
 <button id="csvBtn">Download Sample CSV</button></div>`;
 $("csvBtn").onclick=downloadCSV;
}
function addSubjects(id){
 [...new Set(Object.values(timetable).flat().map(r=>r[1]))].forEach(s=>{
  const o=document.createElement("option");o.value=s;o.textContent=s;$(id).appendChild(o);
 });
}
function downloadCSV(){
 const content="Student ID,Subject,Date,Status\nDEMO001,Chemistry,2026-10-27,Sample only\n";
 const blob=new Blob([content],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download="attendance-demo.csv";a.click();
 URL.revokeObjectURL(url);
}
$("logoutBtn").onclick=()=>{
 stopQR();role="";user="";
 $("dashboard").classList.add("hidden");
 $("loginPage").classList.remove("hidden");
 $("userId").value="";$("view").innerHTML="";
};
</script>
</body>
</html>
