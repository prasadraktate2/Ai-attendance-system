<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance - Login</title>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
    .card { max-width: 420px; margin: 40px auto; padding: 24px; background: white; border-radius: 16px; box-shadow: 0 4px 15px #00000010; }
    h1 { color: #172554; margin-top: 0; text-align: center; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; }
    input, select { border: 1px solid #cbd5e1; background: white; }
    button { margin-top: 18px; border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    #loginMessage { color: #b91c1c; font-weight: bold; min-height: 20px; margin-top: 12px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>📷 AI Smart Attendance</h1>

    <label for="role">Login as</label>
    <select id="role">
      <option value="">Select</option>
      <option value="staff">Staff</option>
      <option value="student">Student</option>
    </select>

    <label for="userId" id="idLabel">ID (staff: email)</label>
    <input id="userId" type="text" placeholder="Student ID or staff email">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter your password">

    <button onclick="login()">Login</button>
    <p id="loginMessage"></p>
  </div>

  <script type="module">
    import { getStudent, firebaseConfig } from "./store.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    document.getElementById('role').addEventListener('change', function () {
      const idLabel = document.getElementById('idLabel');
      const idBox = document.getElementById('userId');
      if (this.value === 'staff') {
        idLabel.textContent = 'Staff Email';
        idBox.placeholder = 'Enter staff email';
      } else if (this.value === 'student') {
        idLabel.textContent = 'Student ID';
        idBox.placeholder = 'Enter student ID';
      } else {
        idLabel.textContent = 'ID (staff: email)';
        idBox.placeholder = 'Student ID or staff email';
      }
    });

    window.login = async function () {
      const rawId = document.getElementById('userId').value.trim();
      const id = rawId.toUpperCase();
      const pass = document.getElementById('password').value;
      const role = document.getElementById('role').value.trim().toLowerCase();
      const message = document.getElementById('loginMessage');
      let name = '';
      let roll = '';
      let batch = '';
      message.textContent = '';

      if (role !== 'staff' && role !== 'student') {
        message.textContent = 'Please select Staff or Student.';
        return;
      }
      if (!rawId) {
        message.textContent = role === 'staff'
          ? 'Please enter the staff email.'
          : 'Please enter the student ID.';
        return;
      }
      if (!pass) {
        message.textContent = 'Please enter your password.';
        return;
      }

      if (role === 'staff') {
        try {
          const auth = getAuth(initializeApp(firebaseConfig));
          await signInWithEmailAndPassword(auth, rawId.toLowerCase(), pass);
        } catch (e) {
          console.error(e);
          message.textContent = 'Wrong staff email or password.';
          return;
        }
        name = 'Staff';
      }

      if (role === 'student') {
        try {
          const found = await getStudent(id);
          if (!found || !found.password ||
              found.password.toUpperCase() !== pass.trim().toUpperCase()) {
            message.textContent = 'Wrong ID or password.';
            return;
          }
          name = found.name;
          roll = found.roll || '';
          batch = found.batch || '';
        } catch (e) {
          console.error(e);
          message.textContent = 'Could not check your ID. Check your internet.';
          return;
        }
      }

      sessionStorage.setItem('attendanceUser', name);
      sessionStorage.setItem('attendanceRole', role);
      sessionStorage.setItem('attendanceUserId', role === 'staff' ? rawId.toLowerCase() : id);
      sessionStorage.setItem('attendanceRoll', roll);
      sessionStorage.setItem('attendanceBatch', batch);

      window.location.href = './dashboard.html';
    };
  </script>
</body>
</html>
