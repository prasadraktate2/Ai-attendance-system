<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance - Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000010;
    }

    h1 { color: #172554; margin-top: 0; text-align: center; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      margin-top: 18px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #loginMessage {
      color: #b91c1c;
      font-weight: bold;
      min-height: 20px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>📷 AI Smart Attendance</h1>

    <label for="role">Login as</label>
    <select id="role">
      <option value="">Select</option>
      <option value="staff">Staff</option>
      <option value="student">Student</option>
    </select>

    <label for="userId">ID</label>
    <input id="userId" type="text" placeholder="Enter your ID">

    <label for="userName">Full Name</label>
    <input id="userName" type="text" placeholder="Enter your full name">

    <button onclick="login()">Login</button>
    <p id="loginMessage"></p>
  </div>

  <script>
    function login() {
      const id = document.getElementById('userId').value.trim();
      const name = document.getElementById('userName').value.trim();
      const role = document.getElementById('role').value.trim().toLowerCase();

      const message = document.getElementById('loginMessage');

      if (!id || !name) {
        message.textContent = 'Please enter your ID and full name.';
        return;
      }

      if (role !== 'staff' && role !== 'student') {
        message.textContent = 'Please select Staff or Student.';
        return;
      }

      sessionStorage.setItem('attendanceUser', name);
      sessionStorage.setItem('attendanceRole', role);
      sessionStorage.setItem('attendanceUserId', id);

      window.location.href = './dashboard.html';
    }
  </script>
</body>
</html>
