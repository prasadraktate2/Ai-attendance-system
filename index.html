<script>
const form = document.getElementById("loginForm");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const role = document.getElementById("role").value;
  const userId = document.getElementById("userId").value.trim();

  if (!userId) {
    document.getElementById("message").textContent =
      "Please enter your User ID.";
    return;
  }

  const card = document.querySelector(".card");

  card.innerHTML = `
    <h1>${role === "staff" ? "Staff Dashboard" : "Student Dashboard"}</h1>
    <p>AI Smart Attendance System</p>

    <div style="background:#eef5ff;padding:15px;border-radius:10px;">
      <strong>Login ID:</strong>
      <span id="loggedUser"></span>
    </div>

    <h3>Features</h3>
    <button type="button" id="timetableBtn">Weekly Timetable</button>
    <button type="button" id="attendanceBtn">My Attendance</button>

    ${role === "staff" ? `
      <button type="button" id="manualBtn">Manual Attendance</button>
      <button type="button" id="reportBtn">Attendance Reports</button>
    ` : ""}

    <div id="content" style="margin-top:20px;"></div>
    <button type="button" id="logoutBtn" style="background:#b42318;">
      Logout
    </button>
  `;

  document.getElementById("loggedUser").textContent = userId;

  document.getElementById("timetableBtn").onclick = () => {
    document.getElementById("content").innerHTML =
      "<h3>Weekly Timetable</h3><p>Monday to Saturday timetable will be added in Part 3.</p>";
  };

  document.getElementById("attendanceBtn").onclick = () => {
    document.getElementById("content").innerHTML =
      "<h3>Attendance</h3><p>Attendance records will be connected in a later part.</p>";
  };

  const manualBtn = document.getElementById("manualBtn");
  if (manualBtn) {
    manualBtn.onclick = () => {
      document.getElementById("content").innerHTML =
        "<h3>Manual Attendance</h3><p>Attendance marking will be added in a later part.</p>";
    };
  }

  const reportBtn = document.getElementById("reportBtn");
  if (reportBtn) {
    reportBtn.onclick = () => {
      document.getElementById("content").innerHTML =
        "<h3>Attendance Reports</h3><p>Reports and CSV download will be added in a later part.</p>";
    };
  }

  document.getElementById("logoutBtn").onclick = () => location.reload();
});
</script>
