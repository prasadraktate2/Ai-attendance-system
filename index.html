<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance - Login</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px #00000010;
    }

    h1 { color: #172554; margin-top: 0; text-align: center; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      margin-top: 18px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #loginMessage {
      color: #b91c1c;
      font-weight: bold;
      min-height: 20px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>📷 AI Smart Attendance</h1>

    <label for="role">Login as</label>
    <select id="role">
      <option value="">Select</option>
      <option value="staff">Staff</option>
      <option value="student">Student</option>
    </select>

    <label for="userId">ID</label>
    <input id="userId" type="text" placeholder="Enter your ID">

    <label for="userName">Full Name (staff)</label>
    <input id="userName" type="text" placeholder="Enter your full name">

    <label for="password">Password (students)</label>
    <input id="password" type="password" placeholder="Password given by your teacher">

    <button onclick="login()">Login</button>
    <p id="loginMessage"></p>
  </div>

  <script type="module">
    import { getStudent, getStudents } from "./store.js";

    window.login = async function () {
      const id = document.getElementById('userId').value.trim().toUpperCase();
      let name = document.getElementById('userName').value.trim();
      let roll = '';
      let batch = '';
      const role = document.getElementById('role').value.trim().toLowerCase();

      const message = document.getElementById('loginMessage');

      if (role !== 'staff' && role !== 'student') {
        message.textContent = 'Please select Staff or Student.';
        return;
      }

      if (!id) {
        message.textContent = 'Please enter your ID.';
        return;
      }

      if (role === 'student') {
        try {
          const roster = await getStudents();
          if (roster.length > 0) {
            const found = await getStudent(id);
            const typed = document.getElementById('password').value.trim().toUpperCase();
            if (!found || !found.password ||
                found.password.toUpperCase() !== typed) {
              message.textContent = 'Wrong ID or password.';
              return;
            }
            name = found.name;
            roll = found.roll || '';
            batch = found.batch || '';
          }
        } catch (e) {
          console.error(e);
          message.textContent = 'Could not check your ID. Check your internet.';
          return;
        }
      }

      if (!name) {
        message.textContent = 'Please enter your full name.';
        return;
      }

      sessionStorage.setItem('attendanceUser', name);
      sessionStorage.setItem('attendanceRole', role);
      sessionStorage.setItem('attendanceUserId', id);
      sessionStorage.setItem('attendanceRoll', roll);
      sessionStorage.setItem('attendanceBatch', batch);

      window.location.href = './dashboard.html';
    };
  </script>
</body>
</html>
