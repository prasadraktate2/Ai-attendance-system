<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Smart Attendance System</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2ff;
  color: #172554;
}

header {
  background: #172554;
  color: white;
  padding: 22px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin-bottom: 0;
}

.login-box {
  background: white;
  max-width: 420px;
  margin: 45px auto;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 8px 25px #00000015;
}

.login-box h2 {
  text-align: center;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

select, input {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 22px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

#message {
  text-align: center;
  margin-top: 15px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🎓 AI Smart Attendance</h1>
  <p>College Attendance Management System</p>
</header>

<div class="login-box">
  <h2>Welcome!</h2>
  <p style="text-align:center">
    Login to continue
  </p>

  <label for="role">Select Login Type</label>
  <select id="role">
    <option value="student">Student Login</option>
    <option value="staff">Staff / Teacher Login</option>
  </select>

  <label for="userId">Student / Staff ID</label>
  <input id="userId" type="text"
         placeholder="Enter your ID">

  <label for="name">Full Name</label>
  <input id="name" type="text"
         placeholder="Enter your name">

  <button onclick="login()">Continue</button>

  <p id="message"></p>
</div>

<footer>
  AI Smart Attendance System © 2026
</footer>

<script>
function login() {
  const role = document.getElementById("role").value;
  const id = document.getElementById("userId").value.trim();
  const name = document.getElementById("name").value.trim();
  const message = document.getElementById("message");

  if (id === "" || name === "") {
    message.style.color = "red";
    message.textContent = "Please enter your ID and name.";
    return;
  }

  message.style.color = "green";
  message.textContent =
    "Demo login successful! Welcome " + name +
    ". Role: " + (role === "student" ? "Student" : "Staff");
}
</script>

</body>
</html>
