<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
    header { background: #000; color: #fff; padding: 16px; display: flex; align-items: center; gap: 14px; }
    header a { color: #fff; text-decoration: none; font-size: 24px; }
    header h1 { margin: 0; font-size: 22px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px #00000012; }
    .center { text-align: center; }
    select { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #cbd5e1; margin: 6px 0; }
    button { padding: 12px 20px; border: 0; border-radius: 10px; font-size: 16px; font-weight: bold; color: #fff; background: #2563eb; cursor: pointer; margin: 4px 0; }
    button.stop { background: #dc2626; }
    button.sec { background: #475569; font-size: 14px; padding: 9px 14px; }
    #qrWrap { display: inline-block; background: #fff; padding: 22px; margin: 16px 0 8px; border: 1px solid #e2e8f0; border-radius: 12px; }
    #qr img, #qr canvas { display: block; max-width: 100%; height: auto; }
    .hint { color: #64748b; font-size: 14px; }
    .count { font-size: 22px; margin-top: 12px; }
    #msg { font-weight: bold; margin-bottom: 10px; text-align: center; color: #b91c1c; }
    h3 { margin: 0 0 6px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #e2e8f0; }
    .row b { display: block; overflow-wrap: anywhere; }
    .row small { color: #64748b; }
    .tg { min-width: 96px; margin: 0; padding: 9px 10px; font-size: 14px; background: #dc2626; }
    .tg.on { background: #16a34a; }
    #sum { font-weight: bold; margin: 8px 0; }
  </style>
</head>
<body>
  <header>
    <a href="dashboard.html">&larr;</a>
    <h1>Take Attendance</h1>
  </header>

  <div class="wrap">
    <div id="msg"></div>

    <div class="card center">
      <label for="slot"><b>Lecture slot (today)</b></label>
      <select id="slot"></select>
      <div class="hint" id="slotTime"></div>
      <button id="startBtn">Start QR Attendance</button>
      <button id="stopBtn" class="stop" hidden>Stop Attendance</button>

      <div id="box" hidden>
        <div id="qrWrap"><div id="qr"></div></div>
        <div class="hint">Students open Attendance and scan this QR. It changes every 30 seconds. Scanning closes automatically when the lecture time ends.</div>
        <div class="count">Present: <b id="count">0</b></div>
      </div>
    </div>

    <div class="card">
      <h3>Manual Attendance</h3>
      <div class="hint">Use this after lecture time or for students who could not scan. Tap a student to change Present / Absent.</div>
      <button class="sec" id="refreshBtn">Refresh List</button>
      <button class="sec" id="allBtn">Mark All Present</button>
      <div id="sum"></div>
      <div id="list"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module">
    const store = await import("./store.js");
    const { saveSession, getSession, watchPresent, getStudents,
            getSessionAttendance, markPresent, removePresent } = store;

    // slots.js is optional: if it is missing on the server, built-in default times are used
    let cfg = null;
    try { cfg = await import("./slots.js"); } catch (e) { console.error(e); }
    if (!cfg) {
      const DEF = [
        { n: 1, start: "10:00", end: "10:55" }, { n: 2, start: "11:00", end: "11:55" },
        { n: 3, start: "12:00", end: "12:55" }, { n: 4, start: "14:00", end: "14:55" },
        { n: 5, start: "15:00", end: "15:55" }
      ];
      const at = (hhmm, base) => {
        const p = hhmm.split(":"); const d = new Date(base);
        d.setHours(+p[0], +p[1], 0, 0); return d.getTime();
      };
      const slotWindowF = (n, base) => {
        const x = DEF.find(y => y.n === n); const b = base || new Date();
        return { startAt: at(x.start, b), endAt: at(x.end, b) + 59000 };
      };
      cfg = {
        ENFORCE_TIME: true, SLOTS: DEF, slotWindow: slotWindowF,
        currentSlot: () => {
          const now = Date.now();
          for (const x of DEF) { const w = slotWindowF(x.n); if (now >= w.startAt && now <= w.endAt) return x; }
          for (const x of DEF) { if (now < slotWindowF(x.n).startAt) return x; }
          return DEF[DEF.length - 1];
        }
      };
      setTimeout(() => {
        document.getElementById("msg").textContent =
          "slots.js not found on server - using default times. Upload slots.js to GitHub.";
      }, 0);
    }
    const { SLOTS, ENFORCE_TIME, slotWindow, currentSlot } = cfg;

    if (typeof getSessionAttendance !== "function" || typeof removePresent !== "function") {
      setTimeout(() => {
        document.getElementById("msg").textContent =
          "Old store.js is on the server. Upload the NEW store.js to GitHub (manual list needs it).";
      }, 0);
    }

    const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
    const userId = sessionStorage.getItem("attendanceUserId");
    const msg = document.getElementById("msg");
    const slotSel = document.getElementById("slot");
    const pad = n => String(n).padStart(2, "0");

    if (role !== "staff") {
      msg.innerHTML = 'Please log in as staff. <a href="index.html">Go to Login</a>';
      document.querySelectorAll(".card").forEach(c => c.hidden = true);
    }

    const todayStr = () => {
      const d = new Date();
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    };
    const sessionIdFor = n => todayStr() + "_S" + n;

    // slot dropdown: only the lectures that happen today (see LECTURES_BY_DAY in slots.js)
    const lecturesToday = typeof cfg.lecturesOn === "function" ? cfg.lecturesOn(new Date()) : SLOTS.length;
    const shown = SLOTS.filter(s => s.n <= (lecturesToday || SLOTS.length));
    shown.forEach(s => {
      const o = document.createElement("option");
      o.value = s.n;
      o.textContent = "Slot " + s.n + "  (" + s.start + " - " + s.end + ")";
      slotSel.appendChild(o);
    });
    const cs = currentSlot().n;
    slotSel.value = shown.some(s => s.n === cs) ? cs : shown[shown.length - 1].n;
    function showSlotTime() {
      const s = SLOTS.find(x => x.n === +slotSel.value);
      document.getElementById("slotTime").textContent =
        "QR scanning allowed only from " + s.start + " to " + s.end +
        (ENFORCE_TIME ? "" : "  (time limit is OFF for testing)");
    }
    showSlotTime();

    // ---------- QR attendance ----------
    let sessionId = null, timer = null, unsub = null, cur = "", prev = "", endAt = 0;
    const newToken = () => String(Math.floor(100000 + Math.random() * 900000));

    function draw() {
      if (typeof QRCode === "undefined") {
        msg.style.color = "#b91c1c";
        msg.textContent = "QR library could not load. Check internet and reload.";
        return;
      }
      const el = document.getElementById("qr");
      el.innerHTML = "";
      new QRCode(el, { text: cur, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.L });
    }

    async function rotate() {
      if (ENFORCE_TIME && Date.now() > endAt) {
        await stopQr("Lecture time is over. QR closed. Use Manual Attendance for the rest.");
        return;
      }
      prev = cur;
      cur = newToken();
      await saveSession(sessionId, { token: cur, prevToken: prev, tokenAt: Date.now() });
      draw();
    }

    async function stopQr(text) {
      clearInterval(timer);
      if (unsub) unsub();
      try { await saveSession(sessionId, { active: false, held: true, token: "", prevToken: "" }); } catch (e) {}
      document.getElementById("box").hidden = true;
      document.getElementById("stopBtn").hidden = true;
      document.getElementById("startBtn").hidden = false;
      slotSel.disabled = false;
      await loadList();
      msg.style.color = "#16a34a";
      msg.textContent = (text || "Attendance stopped.") + " Present " + presentSet.size +
        ", Absent " + (students.length - presentSet.size) +
        ". Students who did not scan are marked Absent.";
    }

    document.getElementById("startBtn").onclick = async () => {
      msg.textContent = "";
      msg.style.color = "#b91c1c";
      const n = +slotSel.value;
      const w = slotWindow(n);
      if (ENFORCE_TIME && Date.now() > w.endAt) {
        msg.textContent = "This lecture time is over. Use Manual Attendance below.";
        return;
      }
      try {
        sessionId = sessionIdFor(n);
        endAt = w.endAt;
        cur = ""; prev = "";
        await saveSession(sessionId, { active: true, slot: n, date: todayStr(), by: userId,
          startAt: w.startAt, endAt: w.endAt, createdAt: Date.now() });
        await rotate();
        timer = setInterval(() => rotate().catch(console.error), 30000);
        unsub = watchPresent(sessionId, c => document.getElementById("count").textContent = c);
        document.getElementById("box").hidden = false;
        document.getElementById("startBtn").hidden = true;
        document.getElementById("stopBtn").hidden = false;
        slotSel.disabled = true;
      } catch (e) {
        console.error(e);
        msg.textContent = "Could not start. Check internet / Firestore rules.";
      }
    };
    document.getElementById("stopBtn").onclick = () => stopQr("Attendance stopped.");

    // ---------- Manual attendance ----------
    let students = [], presentSet = new Set();

    async function ensureSession(sid, n) {
      const s = await getSession(sid);
      if (!s) {
        const w = slotWindow(n);
        await saveSession(sid, { active: false, held: true, slot: n, date: todayStr(), by: userId,
          startAt: w.startAt, endAt: w.endAt, createdAt: Date.now(), manual: true });
      } else if (!s.held) {
        await saveSession(sid, { held: true });
      }
    }

    function updateSum() {
      document.getElementById("sum").textContent =
        "Present " + presentSet.size + " / " + students.length;
    }

    async function loadList() {
      const list = document.getElementById("list");
      list.textContent = "Loading...";
      try {
        const n = +slotSel.value;
        const sid = sessionIdFor(n);
        const res = await Promise.all([getStudents(), getSessionAttendance(sid)]);
        students = res[0];
        presentSet = new Set(res[1].map(r => r.studentId));
        list.innerHTML = "";
        if (!students.length) { list.textContent = "No students added yet."; updateSum(); return; }
        students.forEach(st => {
          const row = document.createElement("div");
          row.className = "row";
          const info = document.createElement("div");
          const b = document.createElement("b");
          b.textContent = st.name;
          const sm = document.createElement("small");
          sm.textContent = st.id + (st.roll ? "  |  Roll " + st.roll : "");
          info.append(b, sm);
          const btn = document.createElement("button");
          btn.className = "tg";
          const paint = () => {
            const on = presentSet.has(st.id);
            btn.textContent = on ? "Present" : "Absent";
            btn.classList.toggle("on", on);
          };
          paint();
          btn.onclick = async () => {
            btn.disabled = true;
            try {
              await ensureSession(sid, n);
              if (presentSet.has(st.id)) {
                await removePresent(sid, st.id);
                presentSet.delete(st.id);
              } else {
                await markPresent(sid, { id: st.id, name: st.name });
                presentSet.add(st.id);
              }
              paint();
              updateSum();
            } catch (e) {
              console.error(e);
              msg.style.color = "#b91c1c";
              msg.textContent = "Could not save. Check internet.";
            }
            btn.disabled = false;
          };
          row.append(info, btn);
          list.appendChild(row);
        });
        updateSum();
      } catch (e) {
        console.error(e);
        list.textContent = "Could not load students.";
      }
    }

    document.getElementById("allBtn").onclick = async () => {
      if (!students.length) return;
      const n = +slotSel.value;
      const sid = sessionIdFor(n);
      try {
        await ensureSession(sid, n);
        for (const st of students) {
          if (!presentSet.has(st.id)) await markPresent(sid, { id: st.id, name: st.name });
        }
      } catch (e) { console.error(e); }
      loadList();
    };
    document.getElementById("refreshBtn").onclick = loadList;
    slotSel.onchange = () => { showSlotTime(); loadList(); };

    if (role === "staff") loadList();
  </script>
</body>
</html>
