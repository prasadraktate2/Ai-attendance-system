<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Attendance</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #172033; }
    header { background: #000; color: #fff; padding: 16px; display: flex; align-items: center; gap: 14px; }
    header a { color: #fff; text-decoration: none; font-size: 24px; }
    header h1 { margin: 0; font-size: 22px; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 14px; }
    .card { background: #fff; border-radius: 14px; padding: 18px; text-align: center; box-shadow: 0 2px 8px #00000012; }
    button { padding: 12px 22px; border: 0; border-radius: 10px; font-size: 16px; font-weight: bold; color: #fff; background: #2563eb; cursor: pointer; margin: 4px; }
    button.stop { background: #dc2626; }
    #qrWrap { display: inline-block; background: #fff; padding: 22px; margin: 16px 0 8px; border: 1px solid #e2e8f0; border-radius: 12px; }
    #qr img, #qr canvas { display: block; max-width: 100%; height: auto; }
    .hint { color: #64748b; font-size: 14px; }
    .count { font-size: 22px; margin-top: 14px; }
    #msg { color: #b91c1c; font-weight: bold; margin-bottom: 10px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="dashboard.html">&larr;</a>
    <h1>Take Attendance</h1>
  </header>

  <div class="wrap">
    <div id="msg"></div>
    <div class="card">
      <button id="startBtn">Start Attendance</button>
      <button id="stopBtn" class="stop" hidden>Stop Attendance</button>

      <div id="box" hidden>
        <div id="qrWrap"><div id="qr"></div></div>
        <div class="hint">Students open Attendance and scan this QR. It changes every 30 seconds.</div>
        <div class="count">Present: <b id="count">0</b></div>
        <div class="hint" id="sid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module">
    import { saveSession, watchPresent } from "./store.js";

    const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
    const userId = sessionStorage.getItem("attendanceUserId");
    const msg = document.getElementById("msg");

    if (role !== "staff") {
      msg.innerHTML = 'Please log in as staff. <a href="index.html">Go to Login</a>';
      document.getElementById("startBtn").hidden = true;
    }

    let sessionId = null, timer = null, unsub = null, cur = "", prev = "";
    const pad = n => String(n).padStart(2, "0");

    function newSessionId() {
      const d = new Date();
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
        "_" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
    }
    const newToken = () => String(Math.floor(100000 + Math.random() * 900000));

    function draw() {
      const el = document.getElementById("qr");
      el.innerHTML = "";
      new QRCode(el, { text: cur, width: 300, height: 300,
        correctLevel: QRCode.CorrectLevel.L });
    }

    async function rotate() {
      prev = cur;
      cur = newToken();
      await saveSession(sessionId, { token: cur, prevToken: prev, tokenAt: Date.now() });
      draw();
    }

    document.getElementById("startBtn").onclick = async () => {
      msg.textContent = "";
      try {
        sessionId = newSessionId();
        cur = ""; prev = "";
        await saveSession(sessionId, { active: true, createdAt: Date.now(),
          by: userId, date: sessionId.slice(0, 10) });
        await rotate();
        timer = setInterval(() => rotate().catch(console.error), 30000);
        unsub = watchPresent(sessionId, n => document.getElementById("count").textContent = n);
        document.getElementById("sid").textContent = "Session: " + sessionId;
        document.getElementById("box").hidden = false;
        document.getElementById("startBtn").hidden = true;
        document.getElementById("stopBtn").hidden = false;
      } catch (e) {
        console.error(e);
        msg.textContent = "Could not start. Check internet / Firestore rules.";
      }
    };

    document.getElementById("stopBtn").onclick = async () => {
      clearInterval(timer);
      if (unsub) unsub();
      try { await saveSession(sessionId, { active: false, token: "", prevToken: "" }); } catch (e) {}
      document.getElementById("box").hidden = true;
      document.getElementById("stopBtn").hidden = true;
      document.getElementById("startBtn").hidden = false;
      msg.style.color = "#16a34a";
      msg.textContent = "Attendance stopped. Session saved.";
    };
  </script>
</body>
</html>
