<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Smart Attendance - Home</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #000;
      color: white;
      padding: 20px 18px 56px;
      border-radius: 0 0 40px 0;
    }

    .top { display: flex; justify-content: space-between; align-items: center; }
    .app { font-size: 22px; font-weight: bold; }
    .out {
      padding: 8px 14px; border: 1px solid #fff; border-radius: 8px;
      background: transparent; color: white; font-size: 14px; cursor: pointer;
    }
    .name { margin: 18px 0 4px; font-size: 22px; font-weight: bold; color: #fcd34d; text-transform: uppercase; overflow-wrap: anywhere; }
    .meta { font-size: 15px; color: #e2e8f0; }

    .info {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid #334155;
    }
    .info div { font-size: 15px; font-weight: bold; }
    .info small { display: block; color: #94a3b8; font-weight: normal; font-size: 13px; }

    .stats { display: flex; gap: 12px; margin-top: 14px; }
    .stat { flex: 1; background: #1e293b; border-radius: 12px; padding: 10px 12px; }
    .stat small { color: #94a3b8; display: block; }
    .stat b { font-size: 24px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 0 16px;
      margin: -34px auto 24px;
      max-width: 700px;
    }

    .tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 120px; padding: 10px; background: white; border-radius: 14px;
      box-shadow: 0 3px 10px #00000018; text-decoration: none; color: #0f172a;
      text-align: center; font-weight: bold; font-size: 15px;
    }
    .tile span { font-size: 38px; margin-bottom: 8px; }

    .center { max-width: 420px; margin: 40px auto; padding: 20px; text-align: center; }
    .btn {
      display: inline-block; padding: 12px 20px; border-radius: 10px;
      background: #2563eb; color: white; font-weight: bold; text-decoration: none;
    }
  </style>
</head>

<body>
  <div id="loginCard" class="center" hidden>
    <h2>Please log in</h2>
    <a class="btn" href="index.html">Go to Login</a>
  </div>

  <div id="home" hidden>
    <header>
      <div class="top">
        <div class="app">📷 Smart Attendance</div>
        <button class="out" onclick="logout()">Logout</button>
      </div>
      <div class="name" id="welcome"></div>
      <div class="meta" id="meta"></div>
      <div class="info" id="info"></div>
      <div class="stats">
        <div class="stat"><small id="todayLabel">Attendance Today</small><b id="todayCount">0</b></div>
        <div class="stat" id="totalBox"><small>Total Students</small><b id="totalCount">0</b></div>
      </div>
    </header>

    <div class="grid" id="grid"></div>
  </div>

  <script type="module">
    import { watchToday, getStudents } from "./store.js";
    import { CLASS_INFO } from "./timetable.js";

    const name = sessionStorage.getItem("attendanceUser");
    const role = (sessionStorage.getItem("attendanceRole") || "").toLowerCase();
    const userId = sessionStorage.getItem("attendanceUserId");

    window.logout = function () {
      sessionStorage.clear();
      window.location.href = "index.html";
    };

    function todayString() {
      const d = new Date();
      return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
    }

    if (!name || (role !== "staff" && role !== "student")) {
      document.getElementById("loginCard").hidden = false;
    } else {
      document.getElementById("home").hidden = false;
      document.getElementById("welcome").textContent = name;
      document.getElementById("meta").textContent =
        userId + "  |  " + (role === "staff" ? "Staff" : "Student");

      const isStaff = role === "staff";

      const infoItems = [
        ["Branch", CLASS_INFO.branch],
        ["Sem", CLASS_INFO.sem],
        ["Division", CLASS_INFO.division]
      ];
      if (!isStaff) {
        infoItems.push(["Roll No.", sessionStorage.getItem("attendanceRoll") || "-"]);
        infoItems.push(["Batch", sessionStorage.getItem("attendanceBatch") || "-"]);
      }
      infoItems.forEach(function (it) {
        const box = document.createElement("div");
        const label = document.createElement("small");
        label.textContent = it[0];
        box.append(label, document.createTextNode(it[1]));
        document.getElementById("info").appendChild(box);
      });
      const tiles = [
        ["📅", "Academic Calendar", "board.html?type=calendar"],
        ["🕒", "Time Table", "timetable.html"],
        ["✅", "Attendance", isStaff ? "qr-attendance.html" : "scan-attendance.html"],
        ["📚", "LMS", "lms.html"],
        ["🔔", "Notifications", "board.html?type=notice"]
      ];
      if (isStaff) tiles.push(["👩‍🎓", "Students", "students.html"]);
      else tiles.push(["📊", "My Attendance", "my-attendance.html"]);

      const grid = document.getElementById("grid");
      tiles.forEach(function (t) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = t[2];
        const icon = document.createElement("span");
        icon.textContent = t[0];
        a.append(icon, document.createTextNode(t[1]));
        grid.appendChild(a);
      });

      if (isStaff) {
        watchToday(todayString(), null, function (n) {
          document.getElementById("todayCount").textContent = n;
        });
        getStudents().then(function (l) {
          document.getElementById("totalCount").textContent = l.length;
        }).catch(function () {});
      } else {
        document.getElementById("totalBox").hidden = true;
        document.getElementById("todayLabel").textContent = "My Attendance Today";
        watchToday(todayString(), userId, function (n) {
          document.getElementById("todayCount").textContent = n;
        });
      }
    }
  </script>
</body>
</html>
